<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trollhouse ist umgezogen</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #120d17; color: #fffaf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; background: #24152a; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 24px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  p { margin: 0 0 12px; color: #d8cfda; line-height: 1.45; }
  ol { margin: 0; padding-left: 1.2em; color: #d8cfda; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Trollhouse ist umgezogen 🏠</h1>
  <p>Die App hat eine neue Adresse und ist jetzt nur noch für eingeladene Freunde.</p>
  <ol>
    <li>Deinen persönlichen Einladungslink bekommst du von Niklas per WhatsApp.</li>
    <li>Öffne den Link, die App startet direkt.</li>
    <li>Lege die neue App auf den Home-Bildschirm und lösche die alte.</li>
  </ol>
</main>
<script>
  // Alte Offline-Kopie der App entfernen (Service Worker und Caches)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then((liste) => liste.forEach((r) => r.unregister())).catch(() => {});
  }
  if (window.caches) {
    caches.keys().then((namen) => namen.forEach((n) => caches.delete(n))).catch(() => {});
  }
</script>
</body>
</html>
